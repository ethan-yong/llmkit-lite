[project]
name = "llmkit-lite"
version = "0.1.0"
description = "A lightweight starter kit for production LLM application services."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.28.0",
  "pydantic>=2.10.0",
]

[project.optional-dependencies]
api = [
  "fastapi>=0.115.0",
]
graphs = [
  "langchain-core>=0.3.0,<2.0",
  "langgraph>=1.2.0,<2.0",
]
cli = [
  "typer>=0.12.0",
]
dev = [
  "fastapi>=0.115.0",
  "langchain-core>=0.3.0,<2.0",
  "langgraph>=1.2.0,<2.0",
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "respx>=0.21.0",
  "ruff>=0.9.0",
]

[project.scripts]
llmkit-lite = "llmkit_lite.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llmkit_lite"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["llmkit_lite"]
